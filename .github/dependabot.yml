version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # ci.yml intentionally pins 1.87.0 to verify the declared MSRV.
    ignore:
      - dependency-name: dtolnay/rust-toolchain
